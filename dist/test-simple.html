<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxhole - Simple Test</title>
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            background: #F8F7FA;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #7367f0;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #e7e3ff;
            color: #7367f0;
            border: 1px solid #7367f0;
        }
        #js-test {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Foxhole Deployment Test</h1>

        <div class="status info">
            <strong>HTML:</strong> Working correctly!
        </div>

        <div id="css-test" class="status success">
            <strong>CSS:</strong> Styles loaded successfully!
        </div>

        <div id="js-result" class="status error">
            <strong>JavaScript:</strong> Not loaded (waiting...)
        </div>

        <div id="php-link" class="status info">
            <strong>PHP Test:</strong> <a href="test.php">Click here to test PHP</a>
        </div>

        <div id="server-info" class="status info">
            <strong>Server Info:</strong> Checking...
        </div>
    </div>

    <!-- Regular script (not module) to test basic JS -->
    <script>
        document.getElementById('js-result').className = 'status success';
        document.getElementById('js-result').innerHTML = '<strong>JavaScript:</strong> Working correctly!';

        // Show some info
        var info = 'User Agent: ' + navigator.userAgent;
        document.getElementById('server-info').innerHTML = '<strong>Browser Info:</strong> ' + info.substring(0, 100) + '...';
    </script>
</body>
</html>
