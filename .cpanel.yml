---
deployment:
  tasks:
    # Set deployment path - crew.neofox.live subdomain directory
    - export DEPLOYPATH=/home2/sunburni/public_html/crewneofox

    # Install dependencies and build
    - /bin/npm install --production=false
    - /bin/npm run build

    # Create deployment directory if it doesn't exist
    - /bin/mkdir -p $DEPLOYPATH

    # Clear old files in deployment directory (except .htaccess)
    - /bin/find $DEPLOYPATH -mindepth 1 ! -name '.htaccess' -delete 2>/dev/null || true

    # Copy built files to deployment directory
    - /bin/cp -R dist/* $DEPLOYPATH/

    # Copy .htaccess for routing
    - /bin/cp public/.htaccess $DEPLOYPATH/.htaccess 2>/dev/null || true

    # Copy PHP entry point (serves files with correct MIME types)
    - /bin/cp public/index.php $DEPLOYPATH/index.php 2>/dev/null || true
