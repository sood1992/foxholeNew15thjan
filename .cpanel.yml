---
deployment:
  tasks:
    # Set deployment path - crew.neofox.live subdomain directory
    - export DEPLOYPATH=/home2/sunburni/public_html/crewneofox

    # Create deployment directory if it doesn't exist
    - /bin/mkdir -p $DEPLOYPATH

    # Clear ALL old files including .htaccess (fresh deploy)
    - /bin/rm -rf $DEPLOYPATH/* $DEPLOYPATH/.htaccess 2>/dev/null || true

    # Copy pre-built files to deployment directory (includes .htaccess and index.php)
    - /bin/cp -R dist/* $DEPLOYPATH/
    - /bin/cp dist/.htaccess $DEPLOYPATH/.htaccess
